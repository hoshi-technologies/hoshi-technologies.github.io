# Configuration de l'application Shopify « Hoshi Club ».
# `npm run config:link` remplit client_id. L'adresse de production est celle du Worker
# Cloudflare (même valeur que SHOPIFY_APP_URL dans wrangler.jsonc).
client_id = ""
name = "Hoshi Club"
application_url = "https://hoshi-club.hoshi-technologies.workers.dev"
embedded = true

[access_scopes]
# Clients (membres + étiquettes de niveau + segments), commandes (points) et réductions
scopes = "write_customers,read_orders,write_discounts"

[auth]
redirect_urls = ["https://hoshi-club.hoshi-technologies.workers.dev/auth/callback"]

[app_proxy]
# Le widget de la boutique appelle https://<boutique>/apps/hoshi-club/...
url = "https://hoshi-club.hoshi-technologies.workers.dev/proxy"
subpath = "hoshi-club"
prefix = "apps"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Points gagnés à chaque commande payée
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = ["orders/paid"]

  # Points retirés en cas de remboursement
  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = ["refunds/create"]

  # Bonus de bienvenue à la création d'un compte client
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/create"
  topics = ["customers/create"]

  # Webhooks RGPD obligatoires
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[pos]
embedded = false
