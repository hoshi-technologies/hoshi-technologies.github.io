name: Programme PMU (Hoshi Turf)

# Récupère automatiquement les courses, partants, cotes et arrivées
# et les publie dans hippique/data/ pour la page Hoshi Turf.
on:
  schedule:
    - cron: '7 5-21 * * *' # passage complet toutes les heures, de 6 h à 23 h (heure de Paris, environ)
    - cron: '17,27,37,47,57 8-21 * * *' # cotes des courses proches, toutes les 10 min de 9 h à 23 h
  workflow_dispatch:
    inputs:
      backfill:
        description: "Nombre de journées passées à récupérer (0 = fonctionnement normal)"
        default: '0'
      probe:
        description: "Diagnostic : afficher la structure brute de l'API"
        type: boolean
        default: false
      test_alert:
        description: "Envoyer une notification de test sur le téléphone"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # lire l'état du passage précédent (notifications de panne)

concurrency:
  group: pmu-programme
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests du moteur
        run: node --test tests/*.test.mjs
      - name: Diagnostic API
        if: ${{ inputs.probe }}
        run: node scripts/pmu-probe.mjs
      - name: Récupérer le programme
        if: ${{ !inputs.probe }}
        run: |
          if [ "${{ github.event.schedule }}" = "17,27,37,47,57 8-21 * * *" ]; then
            node scripts/pmu-fetch.mjs --quick
          else
            node scripts/pmu-fetch.mjs --backfill "${{ inputs.backfill || '0' }}"
          fi
      - name: Calibrer le modèle (une fois par jour)
        if: ${{ !inputs.probe && github.event.schedule != '17,27,37,47,57 8-21 * * *' }}
        run: node scripts/calibrate.mjs
      - name: Alertes (paris validés)
        if: ${{ !inputs.probe }}
        env:
          # Sujet ntfy : le secret NTFY_TOPIC s'il existe, sinon le sujet par défaut de Hoshi Turf.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'hoshi-turf-b12tj5jfgndm' }}
          ALERT_TEST: ${{ inputs.test_alert }}
        run: node scripts/pmu-alerts.mjs
      - name: Publier les données
        run: |
          git add hippique/data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "hoshi-turf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hoshi Turf : programme PMU du $(TZ=Europe/Paris date +'%d/%m/%Y %Hh%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
      # Prévient sur le téléphone quand la tâche tombe en panne (une seule fois), puis quand elle repart.
      - name: Prévenir en cas de panne
        if: ${{ failure() && !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'hoshi-turf-b12tj5jfgndm' }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pmu-programme.yml --branch "$GITHUB_REF_NAME" --limit 5 \
            --json databaseId,conclusion -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].conclusion" || echo "")
          if [ "$prev" != "failure" ]; then
            curl -s -H 'Content-Type: application/json' -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ Hoshi Turf : récupération en panne\",\"message\":\"La mise à jour des courses a échoué (API du PMU modifiée ou indisponible ?). Les notifications sont suspendues jusqu'au retour à la normale.\",\"tags\":[\"warning\"],\"priority\":4,\"click\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" https://ntfy.sh/
          fi
      - name: Prévenir du retour à la normale
        if: ${{ success() && !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'hoshi-turf-b12tj5jfgndm' }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pmu-programme.yml --branch "$GITHUB_REF_NAME" --limit 5 \
            --json databaseId,conclusion -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].conclusion" || echo "")
          if [ "$prev" = "failure" ]; then
            curl -s -H 'Content-Type: application/json' -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"✅ Hoshi Turf : de nouveau opérationnel\",\"message\":\"La récupération des courses fonctionne à nouveau.\",\"tags\":[\"white_check_mark\"],\"priority\":3}" https://ntfy.sh/
          fi
