<!doctype html>
<!--
  Hoshi Player — page relais des bandes-annonces (publiée avec GitHub Pages, voir BANDE-ANNONCE.md).
  YouTube exige qu'un lecteur intégré soit placé sur une vraie adresse web : l'appli (page locale)
  affiche donc cette page, qui contient le lecteur YouTube officiel (API iframe) et dialogue avec
  Hoshi Player par messages :
    → appli : {kp:'hello'} page chargée · {kp:'ready'} lecteur prêt · {kp:'state', s, t}
              changement d'état (0 = fin, 1 = lecture, 2 = pause) · {kp:'time', t, s} chaque seconde
              · {kp:'error', code}
    ← appli : {event:'command', func:'playVideo'|'pauseVideo'|'seekTo', args:[…]}
  Aucune donnée n'est collectée.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Bande-annonce</title>
    <style>
      html,
      body,
      #p {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      iframe {
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="p"></div>
    <script>
      (function () {
        var id = (/[?&]v=([\w-]{11})/.exec(location.search) || [])[1];
        var player = null;
        var ready = false;
        function send(o) {
          try {
            parent.postMessage(JSON.stringify(o), '*');
          } catch (e) {
            /* pas de page parente */
          }
        }
        send({ kp: 'hello' });
        if (!id) return send({ kp: 'error', code: 2 });
        window.onYouTubeIframeAPIReady = function () {
          player = new YT.Player('p', {
            width: '100%',
            height: '100%',
            videoId: id,
            playerVars: {
              autoplay: 1,
              controls: 0,
              rel: 0,
              modestbranding: 1,
              playsinline: 1,
              iv_load_policy: 3,
              hl: 'fr',
              cc_lang_pref: 'fr',
              origin: location.origin,
            },
            events: {
              onReady: function (e) {
                ready = true;
                e.target.playVideo();
                send({ kp: 'ready' });
              },
              onStateChange: function (e) {
                send({ kp: 'state', s: e.data, t: player.getCurrentTime() });
              },
              onError: function (e) {
                send({ kp: 'error', code: e.data });
              },
            },
          });
          setInterval(function () {
            if (ready) send({ kp: 'time', t: player.getCurrentTime(), s: player.getPlayerState() });
          }, 1000);
        };
        window.addEventListener('message', function (ev) {
          if (ev.source !== parent) return;
          var d;
          try {
            d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
          } catch (e) {
            return;
          }
          if (d && d.event === 'command' && ready && typeof player[d.func] === 'function')
            player[d.func].apply(player, d.args || []);
        });
        var s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        s.onerror = function () {
          send({ kp: 'error', code: 5 });
        };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
