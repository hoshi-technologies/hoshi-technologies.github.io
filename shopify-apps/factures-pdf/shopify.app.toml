# Configuration de l'appli pour Shopify CLI (`shopify app deploy`).
# client_id : appli « Hoshi Factures » du tableau de bord développeur Shopify. Les URL sont
# remplacées automatiquement par `shopify app dev` (tunnel) ; à remplacer par l'URL de production.

client_id = "29382e5537f3d51df592997c1947800a"
name = "Hoshi Factures"
application_url = "https://hoshi-factures.hoshi-technologies.workers.dev"
embedded = true

[access_scopes]
# Commandes : lecture (webhooks de commande) et écriture d'un seul champ de l'appli, le lien de la
# facture, que le bloc « Télécharger ma facture » de la page de commande affiche.
# Installation gérée par Shopify.
scopes = "write_orders"
use_legacy_install_flow = false

# Lien de la facture, enregistré sur chaque commande facturée (lu par le bloc de la page de commande).
[order.metafields.app.invoice_url]
type = "url"
name = "Facture Hoshi Factures"
description = "Lien de téléchargement de la facture PDF de la commande"
access.admin = "merchant_read"
access.customer_account = "read"

[auth]
redirect_urls = ["https://hoshi-factures.hoshi-technologies.workers.dev/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/paid", "app/uninstalled", "app_subscriptions/update"]
  uri = "/webhooks"

  # Webhooks RGPD obligatoires pour publier sur l'App Store Shopify.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"

[pos]
embedded = false

[build]
include_config_on_deploy = true
# `shopify app dev` remplace application_url par l'adresse du tunnel de développement.
automatically_update_urls_on_dev = true
