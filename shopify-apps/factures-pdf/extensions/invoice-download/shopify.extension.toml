# Bouton « Télécharger ma facture » dans l'espace client Shopify (liste des commandes et page
# de la commande). Ajouté automatiquement à toutes les boutiques qui installent l'appli :
# le marchand n'a aucun code à coller.
api_version = "2026-10"

[[extensions]]
type = "ui_extension"
name = "Télécharger ma facture"
handle = "invoice-download"
uid = "99fa737f-b231-4d4f-bdd3-381620237228"

[[extensions.targeting]]
module = "./src/DownloadInvoiceButton.jsx"
target = "customer-account.order.action.menu-item.render"

[extensions.capabilities]
# Appel au serveur Hoshi Factures (autorisé dans le tableau de bord : « Demandes d'accès à l'API »
# → « Autoriser l'accès au réseau dans les extensions de paiement et de compte »).
network_access = true
