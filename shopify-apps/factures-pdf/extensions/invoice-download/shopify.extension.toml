# Bloc « Télécharger ma facture » sur la page de commande Shopify : le client y arrive depuis
# « Afficher votre commande » dans l'e-mail de confirmation, ou depuis son compte client.
# Aucun code à coller pour le marchand (il ajoute le bloc une fois dans l'éditeur), aucune
# connexion pour le client : le lien est lu dans un champ de la commande (metafield de l'appli),
# que Shopify ne montre qu'à la personne qui consulte cette commande.
api_version = "2026-10"

[[extensions]]
type = "ui_extension"
name = "Télécharger ma facture"
handle = "invoice-download"
uid = "99fa737f-b231-4d4f-bdd3-381620237228"

[[extensions.targeting]]
module = "./src/DownloadInvoiceBlock.jsx"
target = "customer-account.order-status.block.render"

[[extensions.metafields]]
namespace = "$app"
key = "invoice_url"
owner_type = "ORDER"
